baseURL: 'https://richardbowey.co.uk/'
locale: 'en-gb'
title: "Richard Bowey's Portfolio"
caches:
  images:
    dir: :cacheDir/images
disableKinds:
  - taxonomy
  - term
markup:
  highlight:
    noClasses: false
    style: catppuccin-mocha
cascade:
  - outputs:
      - html
      - markdown
    target:
      kind: page
      path: "/blog/**"
outputFormats:
  markdown:
    mediaType: text/markdown
    isPlainText: true
    ugly: true
  json:
    mediaType: application/json
    isPlainText: true
    ugly: true
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css
module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
security:
  allowContent:
    - ^text/(html|markdown)$
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
